<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Bot — Demo</title>
<style>
  :root {
    --bg: #eae6df; --panel: #ffffff; --ink: #111b21; --muted: #667781;
    --mine: #d9fdd3; --theirs: #ffffff; --accent: #008069; --line: #e2e2e2;
    --chat-bg: #efeae2; --tag: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b141a; --panel: #111b21; --ink: #e9edef; --muted: #8696a0;
      --mine: #005c4b; --theirs: #202c33; --accent: #00a884; --line: #2a3942;
      --chat-bg: #0b141a; --tag: #202c33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .layout { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; height: 100vh; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; height: auto; } .chat { height: 80vh; } }
  .chat, .side { background: var(--panel); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header .avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff3; display: grid; place-items: center; font-size: 18px; }
  header small { display: block; opacity: .8; font-size: 12px; }
  header button { margin-left: auto; background: #fff2; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #mensajes { flex: 1; overflow-y: auto; padding: 16px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 7px 10px; border-radius: 8px; white-space: pre-wrap; box-shadow: 0 1px .5px #0002; }
  .yo { align-self: flex-end; background: var(--mine); }
  .bot { align-self: flex-start; background: var(--theirs); }
  .accion { align-self: center; font-size: 12px; color: var(--muted); background: var(--tag); padding: 2px 8px; border-radius: 6px; }
  .escribiendo { align-self: flex-start; color: var(--muted); font-style: italic; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  form button { background: var(--accent); color: #fff; border: 0; border-radius: 20px; padding: 0 18px; cursor: pointer; font: inherit; }
  .side { padding: 16px; overflow-y: auto; }
  .side h2 { margin: 0 0 4px; font-size: 18px; }
  .side p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .cancelada { color: var(--muted); text-decoration: line-through; }
  .tel { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .tel input { flex: 0 1 180px; padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div class="layout">
  <section class="chat">
    <header>
      <div class="avatar">🦷</div>
      <div>Clínica Dental Sonrisa<small>Asistente virtual</small></div>
      <button id="reiniciar" title="Empezar conversación de nuevo">Reiniciar</button>
    </header>
    <div id="mensajes">
      <div class="accion">Escribe como si fueras un paciente por WhatsApp</div>
    </div>
    <form id="form">
      <input id="texto" placeholder="Hola, quiero agendar una limpieza…" autocomplete="off" autofocus>
      <button>Enviar</button>
    </form>
  </section>

  <section class="side">
    <h2>Agenda de la clínica</h2>
    <p>Lo que vería la recepcionista. Se actualiza cuando el bot agenda o cancela.</p>
    <div class="tel">Teléfono del paciente: <input id="telefono" value="+57 300 000 0000"></div>
    <table>
      <thead><tr><th>#</th><th>Paciente</th><th>Servicio</th><th>Fecha</th></tr></thead>
      <tbody id="citas"></tbody>
    </table>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NOMBRES = {
  listar_servicios: "consultó servicios", ver_disponibilidad: "revisó disponibilidad",
  agendar_cita: "agendó la cita", buscar_citas: "buscó citas", cancelar_cita: "canceló la cita",
};

function agregar(clase, texto) {
  const div = document.createElement("div");
  div.className = clase;
  div.textContent = texto;
  $("mensajes").appendChild(div);
  $("mensajes").scrollTop = $("mensajes").scrollHeight;
  return div;
}

async function cargarCitas() {
  const citas = await fetch("/citas").then((r) => r.json());
  $("citas").innerHTML = "";
  for (const c of citas) {
    const tr = document.createElement("tr");
    if (c.estado === "cancelada") tr.className = "cancelada";
    for (const v of [c.id, c.paciente, c.servicio, c.inicio]) {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    }
    $("citas").appendChild(tr);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  $("texto").value = "";
  agregar("msg yo", texto);
  const espera = agregar("escribiendo", "Sofía está escribiendo…");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telefono: $("telefono").value, texto }),
    });
    const data = await r.json();
    espera.remove();
    if (!r.ok) return agregar("accion", "⚠️ " + (typeof data.detail === "string" ? data.detail : "Revisa el teléfono y el mensaje"));
    for (const a of data.acciones) {
      agregar("accion", "⚙️ " + (NOMBRES[a.herramienta] || a.herramienta) + (a.error ? " (no se pudo)" : ""));
    }
    agregar("msg bot", data.respuesta);
    cargarCitas();
  } catch {
    espera.remove();
    agregar("accion", "⚠️ No se pudo conectar con el servidor");
  }
});

$("reiniciar").addEventListener("click", async () => {
  await fetch("/reiniciar/" + encodeURIComponent($("telefono").value), { method: "POST" });
  $("mensajes").innerHTML = "";
  agregar("accion", "Conversación reiniciada");
});

cargarCitas();
</script>
</body>
</html>
